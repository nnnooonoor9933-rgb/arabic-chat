<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدردشة العربية</title>
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#121f2b;color:#fff}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(520px,100%);background:#1b2e3d;border-radius:18px;padding:28px;box-sizing:border-box;text-align:center}
h1{margin-top:0}.status{padding:12px;border-radius:10px;background:#0b141a;color:#a4b0be}
</style>
</head>
<body>
<main><section class="card">
<h1>الدردشة العربية</h1>
<p>تم تجهيز بيئة المشروع الجديدة.</p>
<div class="status" id="status">Firebase: جاري التحقق...</div>
</section></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
get(ref(db,"/")).then(()=>document.getElementById("status").textContent="Firebase: متصل بالمشروع الجديد")
.catch(e=>document.getElementById("status").textContent="Firebase: قاعدة البيانات مغلقة حالياً");
</script>
</body>
</html>
